name: Docker Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/GZCTF
    steps:
      - name: Checkout upstream repository
        uses: actions/checkout@v3
        with:
          repository: GZTimeWalker/GZCTF
          ref: main
        
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - name: Get current datetime
        id: datetime
        run: echo "time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
      - name: Update environment variable name
        run: |
          find Services/Container/Manager -type f -name "*.cs" -exec sed -i 's/GZCTF_FLAG/FLAG/g' {} +

      

      - name: Prebuild project
        run: |
          npm i -g pnpm
          dotnet build "GZCTF.csproj" -c Release -o build

      - name: Publish project
        run: |
          dotnet publish "GZCTF.csproj" -c Release -o publish/linux/amd64 -r linux-x64 --no-self-contained /p:PublishReadyToRun=true

          # ignore arm64 for non-release tags
          dotnet publish "GZCTF.csproj" -c Release -o publish/linux/arm64 -r linux-arm64 --no-self-contained /p:PublishReadyToRun=true /p:EFOptimizeContext=false

        env:
          VITE_APP_BUILD_TIMESTAMP: ${{ steps.datetime.outputs.time }}
          VITE_APP_GIT_SHA: ${{ github.sha }}
          VITE_APP_GIT_NAME: ${{ github.ref_name }}

      - name: Get upstream version
        id: upstream_version
        run: |
          echo "version=$(curl -s https://api.github.com/repos/GZTimeWalker/GZCTF/releases/latest | jq -r .tag_name)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gzctf:latest
            ghcr.io/${{ github.repository_owner }}/gzctf:${{ steps.upstream_version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gzctf:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gzctf:${{ steps.upstream_version.outputs.version }}
            registry.cn-hangzhou.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/gzctf:latest
            registry.cn-hangzhou.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/gzctf:${{ steps.upstream_version.outputs.version }}

  


      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.upstream_version.outputs.version }}
          name: Release ${{ steps.upstream_version.outputs.version }}
          body: |
            This is an automated release synchronized with upstream version ${{ steps.upstream_version.outputs.version }}
            Docker images:
            - GitHub Container Registry: `ghcr.io/${{ github.repository_owner }}:${{ steps.upstream_version.outputs.version }}`
            - Docker Hub: `${{ secrets.DOCKERHUB_USERNAME }}/gzctf:${{ steps.upstream_version.outputs.version }}`
            - Aliyun Container Registry: `registry.cn-hangzhou.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/gzctf:${{ steps.upstream_version.outputs.version }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}